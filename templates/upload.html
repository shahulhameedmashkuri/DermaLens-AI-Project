<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload | DermaLens.AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

    <nav class="navbar">
        <a href="/">🏠 Home</a>
        <a href="/upload">📤 Upload</a>
        <a href="/dashboard">🤖 Dashboard</a>
    </nav>

    <h1>📤 Upload Skin Image</h1>

    <p class="subtitle">
        Upload a clear skin image for AI-assisted analysis.
    </p>

    <form action="/upload" method="POST" enctype="multipart/form-data">

    <input type="file"
           name="image"
           accept="image/*"
           required>

    <br><br>

    <button type="submit">
        🔍 Analyze
    </button>

</form>

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
